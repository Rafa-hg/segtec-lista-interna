<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEGTEC — Restablecer contraseña</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
  :root { --navy:#1F3864; --navy2:#2E5395; --orange:#E36C09; --gray:#595959; --border:#D0D8E8; }
  body { font-family:'Inter','Segoe UI',Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy2) 60%, #3a6bc4 100%); }
  .box { background:#fff; border-radius:12px; padding:44px 40px; width:380px; max-width:92vw; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
  .brand { text-align:center; font-size:20px; font-weight:800; letter-spacing:2px; color:var(--navy); margin-bottom:6px; }
  .sub { text-align:center; font-size:11px; color:var(--gray); text-transform:uppercase; letter-spacing:1px; margin-bottom:28px; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:11px; font-weight:600; color:var(--gray); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
  .field input { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:6px; font-size:13px; outline:none; }
  .field input:focus { border-color:var(--navy2); }
  .btn { width:100%; padding:12px; background:var(--navy); color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:700; cursor:pointer; margin-top:6px; }
  .btn:hover { background:var(--navy2); }
  .btn:disabled { background:#aaa; cursor:not-allowed; }
  .msg { margin-top:16px; padding:10px 14px; border-radius:6px; font-size:12px; text-align:center; display:none; }
  .msg.ok { background:#EAF6EC; border:1px solid #B7E3BE; color:#1E7A34; }
  .msg.err { background:#FEE; border:1px solid #FCC; color:#C00; }
  .hint { text-align:center; margin-top:18px; font-size:11px; }
  .hint a { color:var(--navy2); text-decoration:none; }
</style>
</head>
<body>
  <div class="box">
    <div class="brand">SEGTEC</div>
    <div class="sub">Restablecer contraseña</div>

    <div id="form-area">
      <div class="field">
        <label>Nueva contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Repetir contraseña</label>
        <input type="password" id="password2" placeholder="Repetí la contraseña" autocomplete="new-password">
      </div>
      <button class="btn" id="btn-submit" onclick="submitReset()">Guardar nueva contraseña</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="hint"><a href="/login.html">Volver al inicio de sesión</a></div>
  </div>

<script>
function getToken() {
  return new URLSearchParams(window.location.search).get('token') || '';
}
function showMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
}
async function submitReset() {
  const token = getToken();
  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('password2').value;

  if (!token) { showMsg('Este link no es válido. Pedí uno nuevo desde "Olvidé mi contraseña".', false); return; }
  if (p1.length < 8) { showMsg('La contraseña debe tener al menos 8 caracteres.', false); return; }
  if (p1 !== p2) { showMsg('Las contraseñas no coinciden.', false); return; }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'Guardando…';

  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: p1 }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'No se pudo restablecer la contraseña');
    showMsg(data.message || 'Contraseña actualizada. Ya podés iniciar sesión.', true);
    document.getElementById('form-area').style.display = 'none';
  } catch (e) {
    showMsg(e.message, false);
    btn.disabled = false; btn.textContent = 'Guardar nueva contraseña';
  }
}
if (!getToken()) showMsg('Este link no es válido. Pedí uno nuevo desde "Olvidé mi contraseña".', false);
</script>
</body>
</html>
