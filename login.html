<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEGTEC — Ingreso</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1F3864; --navy2: #2E5395; --orange: #E36C09;
    --white: #FFFFFF; --gray: #595959; --border: #D0D8E8;
    --font: 'Inter','Segoe UI',Arial,sans-serif;
  }
  html { font-size: 13px; }
  body { font-family: var(--font); min-height: 100vh; }
  #login-screen {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 60%, #3a6bc4 100%);
  }
  .login-box { background: var(--white); border-radius: 12px; padding: 48px 44px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .login-logo { text-align: center; margin-bottom: 32px; }
  .login-logo .brand { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: var(--navy); display: block; }
  .login-logo .sub { font-size: 11px; color: var(--gray); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
  .login-box h2 { font-size: 16px; font-weight: 600; color: var(--navy); margin-bottom: 24px; text-align: center; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; }
  .field input:focus { border-color: var(--navy2); }
  .btn-login { width: 100%; padding: 12px; background: var(--navy); color: var(--white); border: none; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; margin-top: 8px; }
  .btn-login:hover { background: var(--navy2); }
  .btn-login:disabled { background: #aaa; cursor: not-allowed; }
  .login-error { background: #FEE; border: 1px solid #FCC; color: #C00; padding: 10px 14px; border-radius: 6px; font-size: 12px; margin-top: 12px; display: none; text-align: center; }
  .login-hint { text-align: center; margin-top: 10px; font-size: 11px; color: #aaa; }
  .login-hint a { color: var(--navy2); text-decoration: none; }
  .login-hint a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><span class="brand">SEGTEC</span><span class="sub">Herramienta comercial interna</span></div>
    <h2>Acceso equipo de ventas</h2>
    <div class="field"><label>Email</label><input type="email" id="inp-email" placeholder="tu email" autocomplete="username"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="login-error">Usuario o contraseña incorrectos.</div>
    <p class="login-hint"><a href="#" id="link-forgot" onclick="showForgot(event)">¿Olvidaste tu contraseña?</a></p>
    <p class="login-hint">Acceso exclusivo para el equipo SEGTEC</p>
  </div>

  <div class="login-box" id="forgot-box" style="display:none">
    <div class="login-logo"><span class="brand">SEGTEC</span><span class="sub">Herramienta comercial interna</span></div>
    <h2>Recuperar contraseña</h2>
    <div class="field"><label>Email</label><input type="email" id="forgot-email" placeholder="tu email" autocomplete="username"></div>
    <button class="btn-login" id="btn-forgot" onclick="doForgot()">Enviar link de recuperación</button>
    <div class="login-error" id="forgot-error"></div>
    <div class="login-error" id="forgot-ok" style="display:none;background:#EAF6EC;border-color:#B7E3BE;color:#1E7A34"></div>
    <p class="login-hint"><a href="#" onclick="hideForgot(event)">Volver a ingresar</a></p>
  </div>
</div>
<script>
function showForgot(e) {
  e.preventDefault();
  document.querySelector('.login-box:not(#forgot-box)').style.display = 'none';
  document.getElementById('forgot-box').style.display = 'block';
}
function hideForgot(e) {
  e.preventDefault();
  document.getElementById('forgot-box').style.display = 'none';
  document.querySelector('#login-screen .login-box:not(#forgot-box)').style.display = 'block';
  document.getElementById('forgot-error').style.display = 'none';
  document.getElementById('forgot-ok').style.display = 'none';
}
async function doForgot() {
  const email = document.getElementById('forgot-email').value.trim();
  const errorBox = document.getElementById('forgot-error');
  const okBox = document.getElementById('forgot-ok');
  const btn = document.getElementById('btn-forgot');
  errorBox.style.display = 'none'; okBox.style.display = 'none';
  if (!email) { errorBox.textContent = 'Ingresá tu email.'; errorBox.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const res = await fetch('/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'No se pudo enviar el mail.');
    okBox.textContent = data.message || 'Si el email corresponde a un vendedor activo, te enviamos un link para restablecer tu contraseña.';
    okBox.style.display = 'block';
  } catch (e) {
    errorBox.textContent = e.message;
    errorBox.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Enviar link de recuperación';
  }
}

async function doLogin() {
  const email = document.getElementById('inp-email').value.trim();
  const password = document.getElementById('inp-pass').value;
  const errorBox = document.getElementById('login-error');
  const btn = document.getElementById('btn-login');
  errorBox.style.display = 'none';
  if (!email || !password) { errorBox.textContent = 'Completá email y contraseña.'; errorBox.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Ingresando...';
  try {
    const res = await fetch('/api/vendor-login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      errorBox.textContent = data.error || 'Usuario o contraseña incorrectos.';
      errorBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Ingresar';
      return;
    }
    window.location.href = '/app.html';
  } catch (e) {
    errorBox.textContent = 'No se pudo conectar. Intentá de nuevo.';
    errorBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
}
document.getElementById('inp-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('inp-email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('inp-pass').focus(); });

// Si ya hay sesión de vendedor activa, saltar directo a la app
fetch('/api/me', { credentials: 'include' }).then(async (res) => {
  if (res.ok) {
    const data = await res.json();
    if (data.role === 'vendor') window.location.href = '/app.html';
  }
}).catch(() => {});
</script>
</body>
</html>
