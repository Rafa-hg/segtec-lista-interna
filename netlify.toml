[build]
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/vendor-login"
  to = "/.netlify/functions/vendor-login"
  status = 200

[[redirects]]
  from = "/api/admin-login"
  to = "/.netlify/functions/admin-login"
  status = 200

[[redirects]]
  from = "/api/logout"
  to = "/.netlify/functions/logout"
  status = 200

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/api/quotes-create"
  to = "/.netlify/functions/quotes-create"
  status = 200

[[redirects]]
  from = "/api/quotes-list"
  to = "/.netlify/functions/quotes-list"
  status = 200

[[redirects]]
  from = "/api/vendors-list"
  to = "/.netlify/functions/vendors-list"
  status = 200

[[redirects]]
  from = "/api/vendors-create"
  to = "/.netlify/functions/vendors-create"
  status = 200

  [[redirects]]
  from = "/api/vendors-toggle"
  to = "/.netlify/functions/vendors-toggle"
  status = 200

[[redirects]]
  from = "/api/admin-catalog-upload-chunk"
  to = "/.netlify/functions/admin-catalog-upload-chunk"
  status = 200

[[redirects]]
  from = "/api/admin-catalog-upload-finish"
  to = "/.netlify/functions/admin-catalog-upload-finish"
  status = 200

[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200
  
  [[redirects]]
  from = "/api/forgot-password"
  to = /.netlify/functions/forgot-password"
  status = 200

  [[redirects]]
  from = "/api/reset-password"
  to = "/.netlify/functions/reset-password"
  status = 200

  [[redirects]]
  from = "/api/vendors-admin-reset"
  to = "/.netlify/functions/vendors-admin-reset"
  status = 200
  
[[redirects]]
  from = "/"
  to = "/login.html"
  status = 200
  force = false
