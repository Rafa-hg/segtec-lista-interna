<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEGTEC — Herramienta comercial interna</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1F3864; --navy2: #2E5395; --orange: #E36C09;
    --green: #375623; --red: #C00000; --purple: #7030A0; --gray: #595959;
    --lgray: #F2F5FB; --border: #D0D8E8; --white: #FFFFFF; --text: #1A1A2E;
    --shadow: 0 2px 12px rgba(31,56,100,0.10); --radius: 6px;
    --font: 'Inter','Segoe UI',Arial,sans-serif;
    --rossi:#2E5395; --ppa:#E36C09; --seg:#375623; --vivaldi:#7030A0; --celtron:#595959; --generico:#8a6d3b;
  }
  html { font-size: 13px; }
  body { font-family: var(--font); background: var(--lgray); color: var(--text); min-height: 100vh; }
  a { color: inherit; text-decoration: none; }

  #login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 60%, #3a6bc4 100%); }
  .login-box { background:var(--white); border-radius:12px; padding:48px 44px; width:380px; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
  .login-logo { text-align:center; margin-bottom:32px; }
  .login-logo .brand { font-size:22px; font-weight:800; letter-spacing:2px; color:var(--navy); display:block; }
  .login-logo .sub { font-size:11px; color:var(--gray); letter-spacing:1px; text-transform:uppercase; margin-top:4px; }
  .login-box h2 { font-size:16px; font-weight:600; color:var(--navy); margin-bottom:24px; text-align:center; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:11px; font-weight:600; color:var(--gray); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
  .field input { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:var(--radius); font-size:13px; outline:none; }
  .field input:focus { border-color:var(--navy2); }
  .btn-login { width:100%; padding:12px; background:var(--navy); color:var(--white); border:none; border-radius:var(--radius); font-size:14px; font-weight:700; cursor:pointer; letter-spacing:0.5px; margin-top:8px; }
  .btn-login:hover { background:var(--navy2); }
  .login-error { background:#FEE; border:1px solid #FCC; color:#C00; padding:10px 14px; border-radius:var(--radius); font-size:12px; margin-top:12px; display:none; text-align:center; }
  .login-hint { text-align:center; margin-top:20px; font-size:11px; color:#aaa; }

  #app { display:none; flex-direction:column; min-height:100vh; }
  .topbar { background:var(--navy); color:var(--white); padding:0 24px; height:54px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  .topbar-left { display:flex; align-items:center; gap:14px; }
  .topbar-brand { font-size:15px; font-weight:800; letter-spacing:1.5px; }
  .topbar-sub { font-size:10px; opacity:.6; letter-spacing:1px; }
  .topbar-right { display:flex; align-items:center; gap:14px; }
  .topbar-user { display:flex; align-items:center; gap:10px; font-size:12px; opacity:.85; }
  .btn-logout { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:var(--white); padding:5px 12px; border-radius:4px; font-size:11px; cursor:pointer; }
  .btn-logout:hover { background:rgba(255,255,255,0.22); }
  .btn-quote { background:var(--orange); border:none; color:var(--white); padding:8px 16px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .btn-quote:hover { background:#c95d05; }
  .quote-badge { background:rgba(255,255,255,0.9); color:var(--orange); border-radius:10px; padding:1px 7px; font-size:11px; font-weight:800; }

  .tabnav { background:var(--white); border-bottom:2px solid var(--border); padding:0 24px; display:flex; gap:4px; position:sticky; top:54px; z-index:99; overflow-x:auto; }
  .tab-btn { padding:12px 20px; font-size:12px; font-weight:600; color:var(--gray); border:none; background:none; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; white-space:nowrap; letter-spacing:0.3px; }
  .tab-btn:hover { color:var(--navy); }
  .tab-btn.active { color:var(--navy); border-bottom-color:var(--navy); }

  .filters-bar { background:var(--white); padding:12px 24px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--border); }
  .filters-bar label { font-size:11px; font-weight:600; color:var(--gray); }
  .filter-select, .filter-input { padding:6px 10px; border:1.5px solid var(--border); border-radius:var(--radius); font-size:12px; outline:none; background:var(--lgray); cursor:pointer; }
  .filter-select:focus, .filter-input:focus { border-color:var(--navy2); }
  .filter-input { width:200px; }
  .filter-count { margin-left:auto; font-size:11px; color:var(--gray); background:var(--lgray); padding:4px 10px; border-radius:20px; border:1px solid var(--border); }
  .btn-reset { padding:6px 12px; background:none; border:1.5px solid var(--border); border-radius:var(--radius); font-size:11px; color:var(--gray); cursor:pointer; }
  .btn-reset:hover { border-color:var(--navy); color:var(--navy); }

  .main { padding:20px 24px 90px; flex:1; }
  .tab-content { display:none; }
  .tab-content.active { display:block; }

  .seg-banner { padding:9px 16px; color:var(--white); font-size:12px; font-weight:700; letter-spacing:0.4px; border-radius:var(--radius) var(--radius) 0 0; margin-top:20px; display:flex; align-items:center; gap:10px; }
  .seg-banner:first-child { margin-top:0; }
  .seg-estandar { background:var(--navy); } .seg-rapido { background:var(--orange); }
  .seg-ultra { background:var(--red); } .seg-cadena { background:var(--gray); } .seg-otros { background:var(--purple); }
  .seg-pill { background:rgba(255,255,255,0.2); border-radius:20px; padding:2px 10px; font-size:10px; font-weight:600; }

  .table-wrap { overflow-x:auto; border-radius:0 0 var(--radius) var(--radius); box-shadow:var(--shadow); margin-bottom:4px; }
  table { width:100%; border-collapse:collapse; background:var(--white); font-size:12px; }
  thead th { background:#EEF2FA; color:var(--navy); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; padding:8px 10px; border-bottom:2px solid var(--border); white-space:nowrap; text-align:center; }
  thead th.col-desc { text-align:left; }
  tbody tr { border-bottom:1px solid var(--border); }
  tbody tr:hover { background:#F7F9FF; }
  tbody tr:last-child { border-bottom:none; }
  td { padding:7px 10px; vertical-align:middle; }
  td.col-desc { text-align:left; max-width:260px; font-size:11.5px; line-height:1.4; }
  td.col-num { text-align:right; font-variant-numeric:tabular-nums; }
  td.col-center { text-align:center; }
  td.col-img { text-align:center; padding:5px; }
  .thumb-cell { width:52px; height:52px; object-fit:contain; border-radius:4px; border:1px solid var(--border); background:#fff; }
  .thumb-empty { width:52px; height:52px; display:flex; align-items:center; justify-content:center; font-size:8px; color:#bbb; border:1px dashed var(--border); border-radius:4px; margin:0 auto; text-align:center; line-height:1.2; }

  .badge { display:inline-block; padding:2px 8px; border-radius:3px; font-size:10px; font-weight:700; color:var(--white); letter-spacing:0.3px; white-space:nowrap; }
  .badge-ROSSI{background:var(--rossi);} .badge-PPA{background:var(--ppa);} .badge-SEG{background:var(--seg);}
  .badge-VIVALDI{background:var(--vivaldi);} .badge-CELTRON{background:var(--celtron);} .badge-GENÉRICO{background:var(--generico);}
  .badge-default{background:#7A8699;}

  tr.row-ROSSI{background:#F2F5FC;} tr.row-PPA{background:#FEF6EE;} tr.row-SEG{background:#F1F8EE;}
  tr.row-VIVALDI{background:#F6F0FC;} tr.row-CELTRON{background:#F5F5F5;}
  tr.row-ROSSI:hover{background:#E8EEF9;} tr.row-PPA:hover{background:#FDEEDE;} tr.row-SEG:hover{background:#E6F3E1;} tr.row-VIVALDI:hover{background:#EDE4F9;}

  .precio-min { color:var(--navy2); font-weight:600; }
  .precio-ml { color:var(--orange); font-weight:700; }
  .desc-max { color:var(--green); font-weight:600; }
  .desc-max.warn { color:var(--red); }
  .desc-max.nodata { color:#aaa; font-weight:500; font-style:italic; }
  .stock-ok { color:var(--green); font-weight:600; }
  .stock-low { color:var(--orange); font-weight:600; }
  .stock-zero { color:var(--red); font-weight:600; }
  .stock-unk { color:#aaa; font-style:italic; }

  .bm-cell { font-size:10.5px; color:var(--gray); max-width:90px; white-space:normal !important; word-break:break-word; line-height:1.3; }
  .bm-precio { color:var(--red); font-weight:600; }
  .bm-diff-pos { color:var(--green); font-size:10px; }
  .bm-diff-neg { color:var(--red); font-size:10px; }

  .btn-add { background:var(--navy); color:#fff; border:none; border-radius:14px; padding:5px 12px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .btn-add:hover { background:var(--navy2); }
  .btn-add:disabled { background:#ccc; cursor:not-allowed; }
  .btn-add.added { background:var(--green); }

  .acc-section { margin-top:20px; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  .acc-section:first-child { margin-top:0; }
  .acc-header { background:var(--navy); color:var(--white); padding:9px 16px; font-size:12px; font-weight:700; letter-spacing:0.4px; }

  .empty { text-align:center; padding:60px 20px; color:var(--gray); font-size:13px; }
  .app-footer { text-align:center; padding:16px; font-size:10px; color:var(--gray); border-top:1px solid var(--border); background:var(--white); }

  /* ── QUOTE BAR + DRAWER ── */
  .quote-floatbar { position:fixed; bottom:0; left:0; right:0; background:var(--navy); color:#fff; padding:10px 24px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 -4px 16px rgba(0,0,0,0.2); z-index:150; transform:translateY(100%); transition:transform .25s; }
  .quote-floatbar.show { transform:translateY(0); }
  .quote-floatbar-info { font-size:13px; font-weight:600; }
  .quote-floatbar-total { color:#FFD199; font-weight:800; margin-left:10px; }
  .btn-view-quote { background:var(--orange); color:#fff; border:none; padding:8px 18px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer; }

  .drawer-overlay { position:fixed; inset:0; background:rgba(10,15,25,0.5); z-index:200; display:none; }
  .drawer-overlay.show { display:block; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:520px; max-width:100%; background:#fff; z-index:201; display:flex; flex-direction:column; box-shadow:-8px 0 24px rgba(0,0,0,0.2); transform:translateX(100%); transition:transform .25s; }
  .drawer.show { transform:translateX(0); }
  .drawer-head { background:var(--navy); color:#fff; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; }
  .drawer-head h3 { font-size:15px; font-weight:700; }
  .btn-close-drawer { background:rgba(255,255,255,0.15); border:none; color:#fff; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:16px; }
  .drawer-body { flex:1; overflow-y:auto; padding:16px 20px; }
  .client-fields { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .client-fields input { padding:8px 10px; border:1.5px solid var(--border); border-radius:var(--radius); font-size:12px; }
  .quote-line { border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .quote-line-top { display:flex; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .quote-line-desc { font-size:12px; font-weight:600; color:var(--navy); line-height:1.3; }
  .quote-line-cod { font-size:10.5px; color:var(--gray); }
  .btn-remove { background:none; border:none; color:var(--red); cursor:pointer; font-size:16px; line-height:1; padding:0 4px; }
  .quote-line-ctrls { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .qctrl { display:flex; flex-direction:column; gap:2px; }
  .qctrl label { font-size:9px; text-transform:uppercase; color:var(--gray); font-weight:700; }
  .qctrl input { width:64px; padding:5px 6px; border:1.5px solid var(--border); border-radius:4px; font-size:12px; }
  .qctrl.wide input { width:64px; }
  .qline-price { margin-left:auto; text-align:right; }
  .qline-price .u { font-size:10px; color:var(--gray); }
  .qline-price .t { font-size:14px; font-weight:800; color:var(--orange); }
  .discount-hint { font-size:9px; color:#aaa; margin-top:2px; }
  .discount-hint.warn { color:var(--red); }

  .drawer-footer { border-top:1px solid var(--border); padding:16px 20px; background:#FAFBFF; }
  .totals-row { display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; color:var(--gray); }
  .totals-row.grand { font-size:16px; font-weight:800; color:var(--navy); border-top:1px solid var(--border); padding-top:8px; margin-top:6px; }
  .drawer-actions { display:flex; gap:10px; margin-top:14px; }
  .btn-pdf { flex:1; background:var(--orange); color:#fff; border:none; padding:11px; border-radius:var(--radius); font-size:13px; font-weight:700; cursor:pointer; }
  .btn-pdf:hover { background:#c95d05; }
  .btn-clear { background:none; border:1.5px solid var(--border); color:var(--gray); padding:11px 16px; border-radius:var(--radius); font-size:12px; cursor:pointer; }
  .btn-clear:hover { border-color:var(--red); color:var(--red); }
  .drawer-empty { text-align:center; padding:60px 20px; color:#aaa; font-size:12px; }

  @media (max-width:768px) {
    .topbar { padding:0 12px; } .tabnav { padding:0 8px; } .tab-btn { padding:10px 12px; font-size:11px; }
    .main { padding:12px 12px 100px; } .filters-bar { padding:10px 12px; } .filter-input { width:140px; }
    .drawer { width:100%; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div><div class="topbar-brand">SEGTEC</div><div class="topbar-sub">Herramienta comercial interna</div></div>
    </div>
    <div class="topbar-right">
      <button class="btn-quote" onclick="openDrawer()">
        <span>Presupuesto</span>
        <span class="quote-badge" id="quote-count-top">0</span>
      </button>
      <div class="topbar-user"><span id="user-label"></span><button class="btn-logout" onclick="doLogout()">Cerrar sesión</button></div>
    </div>
  </div>

  <div class="tabnav">
    <button class="tab-btn active" onclick="switchTab('corredizos', this)">Corredizos</button>
    <button class="tab-btn" onclick="switchTab('levadizos', this)">Levadizos</button>
    <button class="tab-btn" onclick="switchTab('pivotantes', this)">Pivotantes</button>
    <button class="tab-btn" onclick="switchTab('accesorios', this)">Accesorios</button>
    <button class="tab-btn" onclick="switchTab('servicios', this)">Servicios</button>
  </div>

  <div class="filters-bar">
    <label>Marca</label>
    <select class="filter-select" id="f-marca" onchange="applyFilters()"><option value="">Todas</option></select>
    <label>Segmento</label>
    <select class="filter-select" id="f-seg" onchange="applyFilters()"><option value="">Todos</option></select>
    <label>Buscar</label>
    <input class="filter-input" id="f-search" type="text" placeholder="Código o descripción…" oninput="applyFilters()">
    <button class="btn-reset" onclick="resetFilters()">✕ Limpiar</button>
    <span class="filter-count" id="f-count">— productos</span>
  </div>

  <div class="main">
    <div class="tab-content active" id="tab-corredizos"><div id="render-corredizos"></div></div>
    <div class="tab-content" id="tab-levadizos"><div id="render-levadizos"></div></div>
    <div class="tab-content" id="tab-pivotantes"><div id="render-pivotantes"></div></div>
    <div class="tab-content" id="tab-accesorios"><div id="render-accesorios"></div></div>
    <div class="tab-content" id="tab-servicios"><div id="render-servicios"></div></div>
  </div>

  <div class="app-footer">SEGTEC SA — Uso interno. Precios en ARS.</div>
</div>

<div class="quote-floatbar" id="quote-floatbar">
  <div class="quote-floatbar-info">
    <span id="qf-count">0 productos</span>
    <span class="quote-floatbar-total" id="qf-total">$ 0</span>
  </div>
  <button class="btn-view-quote" onclick="openDrawer()">Ver presupuesto</button>
</div>

<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>Presupuesto</h3>
    <button class="btn-close-drawer" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-footer" id="drawer-footer"></div>
</div>

<script>
let DATA = {};
const CATALOG_SHEETS = ['CORREDIZOS','LEVADIZOS','PIVOTANTES','ACCESORIOS','SERVICIOS'];

async function loadCatalog() {
  const results = await Promise.all(CATALOG_SHEETS.map(sheet =>
    fetch('/api/catalog?sheet=' + sheet, { credentials: 'include', cache: 'no-store' })
      .then(r => r.ok ? r.json() : [])
      .catch(() => [])
  ));
  CATALOG_SHEETS.forEach((sheet, i) => { DATA[sheet] = results[i] || []; });
}

let currentUser = null;

async function checkSession() {
  try {
    const res = await fetch('/api/me', { credentials: 'include' });
    if (!res.ok) { window.location.href = '/login.html'; return; }
    const data = await res.json();
    if (data.role !== 'vendor') { window.location.href = '/login.html'; return; }
    currentUser = data;
    showApp();
  } catch (e) {
    window.location.href = '/login.html';
  }
}

function doLogout() {
  fetch('/api/logout', { credentials: 'include' }).finally(() => {
    window.location.href = '/login.html';
  });
}

async function showApp() {
  document.getElementById('user-label').textContent = 'Hola, ' + currentUser.name;
  await loadCatalog();
  document.getElementById('app').style.display = 'flex';
  initApp();
}

window.addEventListener('DOMContentLoaded', checkSession);

let currentTab = 'corredizos';
let filters = { marca:'', seg:'', search:'' };
let quote = [];

const SEG_CLASS = {
  'VELOCIDAD ESTÁNDAR': 'seg-estandar', 'EQUIPOS A CADENA': 'seg-cadena',
  'VELOCIDAD RÁPIDA': 'seg-rapido', 'ULTRA RÁPIDO': 'seg-ultra',
  'CORREDIZO RECTO A SIN FIN': 'seg-otros', 'CORREDIZO HORIZONTAL': 'seg-otros',
};
function segClass(seg) {
  for (const [k,v] of Object.entries(SEG_CLASS)) if (seg.includes(k)) return v;
  return 'seg-estandar';
}
function segLabel(seg) {
  const s = (seg||'').trim();
  if (s.includes('ESTÁNDAR')) return ['ESTÁNDAR','≥ 9 seg'];
  if (s.includes('RÁPIDA')) return ['RÁPIDO','6–8 seg'];
  if (s.includes('ULTRA') || s.includes('BRUSHLESS')) return ['ULTRA RÁPIDO','< 6 seg / Brushless'];
  if (s.includes('CADENA')) return ['A CADENA',''];
  if (s.includes('SIN FIN')) return ['SIN FIN / AÉREO',''];
  if (s.includes('HORIZONTAL')) return ['HORIZONTAL / AMERICANO',''];
  return [s || 'General',''];
}
function fmtMoney(v) { if (v===null||v===undefined) return null; return '$ ' + Math.round(v).toLocaleString('es-AR'); }
function fmtPct(v) { if (v===null||v===undefined) return null; return (v*100).toLocaleString('es-AR',{maximumFractionDigits:1}) + '%'; }

function stockCell(v) {
  if (v===null||v===undefined) return '<span class="stock-unk">No controlado</span>';
  if (v===0) return '<span class="stock-zero">Sin stock</span>';
  if (v<5) return '<span class="stock-low">'+v+'</span>';
  return '<span class="stock-ok">'+v+'</span>';
}
function descMaxCell(p) {
  if (!p.pv_min || p.pv_min<=0) return '<span class="desc-max nodata">s/d</span>';
  if (p.desc_max===null||p.desc_max===undefined) return '<span class="desc-max nodata">s/d</span>';
  if (p.desc_max<0) return '<span class="desc-max warn" title="Precio mínimo por encima del precio público — revisar antes de cotizar">⚠ revisar</span>';
  return '<span class="desc-max">'+fmtPct(p.desc_max)+'</span>';
}
function mlCell(p) {
  if (p.ml_ars===null||p.ml_ars===undefined) return '<span style="color:#aaa;font-style:italic">Consultar</span>';
  return '<span class="precio-ml">'+fmtMoney(p.ml_ars)+'</span>';
}
function bmDiffCell(p) {
  if (!p.ml_ars || !p.bm_precio) return '—';
  const diff = ((p.ml_ars - p.bm_precio) / p.bm_precio) * 100;
  const sign = diff>0 ? '+' : '';
  const cls = diff>0 ? 'bm-diff-neg' : 'bm-diff-pos';
  return '<span class="'+cls+'">'+sign+diff.toFixed(0)+'%</span>';
}
function canAdd(p) { return p.ml_ars!==null && p.ml_ars!==undefined; }
function maxDiscount(p) {
  if (!p.pv_min || p.pv_min<=0) return 0;
  if (p.desc_max===null||p.desc_max===undefined||p.desc_max<0) return 0;
  return Math.round(p.desc_max*100);
}

function quoteKey(sheet, codigo, idx) { return sheet+'::'+codigo+'::'+idx; }

function addToQuote(sheet, idx, btn) {
  const p = DATA[sheet][idx];
  quote.push({ sheet, idx, codigo:p.codigo, desc:p.desc, marca:p.marca, ml_ars:p.ml_ars,
    iva:p.iva, maxDisc:maxDiscount(p), qty:1, discount:0 });
  updateQuoteUI();
  if (btn) { btn.textContent='Agregado ✓'; btn.classList.add('added');
    setTimeout(()=>{ btn.textContent='+ Agregar'; btn.classList.remove('added'); }, 1200); }
}

function lineTotal(line) {
  const unit = line.ml_ars * (1 - (line.discount||0)/100);
  return unit * line.qty;
}
function updateQuoteUI() {
  const count = quote.length;
  const total = quote.reduce((s,l)=>s+lineTotal(l), 0);
  document.getElementById('quote-count-top').textContent = count;
  document.getElementById('qf-count').textContent = count + (count===1?' producto':' productos');
  document.getElementById('qf-total').textContent = fmtMoney(total) || '$ 0';
  document.getElementById('quote-floatbar').classList.toggle('show', count>0);
  renderDrawer();
}

function renderDrawer() {
  const body = document.getElementById('drawer-body');
  const footer = document.getElementById('drawer-footer');
  if (!quote.length) {
    body.innerHTML = '<div class="drawer-empty">Todavía no agregaste productos.<br>Usá el botón "+ Agregar" en la tabla.</div>';
    footer.innerHTML = '';
    return;
  }
  let html = '<div class="client-fields">'+
    '<input type="text" id="q-cliente" placeholder="Nombre del cliente" value="'+(window._qCliente||'')+'">'+
    '<input type="text" id="q-empresa" placeholder="Empresa (opcional)" value="'+(window._qEmpresa||'')+'">'+
    '</div>';
  quote.forEach((line, i) => {
    const unit = line.ml_ars * (1 - (line.discount||0)/100);
    const total = unit * line.qty;
    const warn = line.maxDisc===0;
    html += '<div class="quote-line">'+
      '<div class="quote-line-top">'+
        '<div><div class="quote-line-desc">'+line.desc+(line.tipo==='servicio'?' <span style="background:var(--navy2);color:#fff;font-size:9px;padding:1px 6px;border-radius:8px;margin-left:4px">servicio</span>':'')+'</div>'+
        '<div class="quote-line-cod">'+(line.tipo==='servicio' ? line.zonaLabel+' · '+line.pagoLabel : line.marca+' · '+line.codigo)+'</div></div>'+
        '<button class="btn-remove" onclick="removeLine('+i+')">✕</button>'+
      '</div>'+
      '<div class="quote-line-ctrls">'+
        '<div class="qctrl"><label>Cant.</label><input type="number" min="1" value="'+line.qty+'" onchange="updateLine('+i+',\'qty\',this.value)"></div>'+
        '<div class="qctrl"><label>Desc. %</label><input type="number" min="0" max="'+line.maxDisc+'" value="'+line.discount+'" onchange="updateLine('+i+',\'discount\',this.value)">'+
          '<div class="discount-hint'+(warn?' warn':'')+'">'+(warn?'sin piso definido — no descontar':'máx '+line.maxDisc+'%')+'</div></div>'+
        '<div class="qline-price"><div class="u">$ '+Math.round(unit).toLocaleString('es-AR')+' c/u</div><div class="t">'+fmtMoney(total)+'</div></div>'+
      '</div>'+
    '</div>';
  });
  body.innerHTML = html;

  document.getElementById('q-cliente').addEventListener('input', e => window._qCliente = e.target.value);
  document.getElementById('q-empresa').addEventListener('input', e => window._qEmpresa = e.target.value);

  const totalNeto10 = quote.filter(l=>Math.round((l.iva||0)*100)===10).reduce((s,l)=>s+lineTotal(l)/1.10,0);
  const totalNeto21 = quote.filter(l=>Math.round((l.iva||0)*100)===21).reduce((s,l)=>s+lineTotal(l)/1.21,0);
  const totalNetoOther = quote.filter(l=>{const r=Math.round((l.iva||0)*100); return r!==10 && r!==21;}).reduce((s,l)=>s+lineTotal(l),0);
  const ivaTotal = quote.reduce((s,l)=>{
    const total = lineTotal(l); const rate = l.iva||0;
    return s + (rate>0 ? total - total/(1+rate) : 0);
  },0);
  const granTotal = quote.reduce((s,l)=>s+lineTotal(l),0);

  footer.innerHTML =
    '<div class="totals-row"><span>Subtotal neto</span><span>'+fmtMoney(totalNeto10+totalNeto21+totalNetoOther)+'</span></div>'+
    '<div class="totals-row"><span>IVA</span><span>'+fmtMoney(ivaTotal)+'</span></div>'+
    '<div class="totals-row grand"><span>Total</span><span>'+fmtMoney(granTotal)+'</span></div>'+
    '<div class="drawer-actions">'+
      '<button class="btn-clear" onclick="clearQuote()">Vaciar</button>'+
      '<button class="btn-pdf" onclick="downloadPdf()">Descargar PDF</button>'+
    '</div>';
}

function updateLine(i, field, value) {
  const line = quote[i];
  if (field==='qty') line.qty = Math.max(1, parseInt(value)||1);
  if (field==='discount') line.discount = Math.max(0, Math.min(line.maxDisc, parseFloat(value)||0));
  updateQuoteUI();
}
function removeLine(i) { quote.splice(i,1); updateQuoteUI(); }
function clearQuote() { quote = []; updateQuoteUI(); }

function openDrawer() { document.getElementById('drawer').classList.add('show'); document.getElementById('drawer-overlay').classList.add('show'); renderDrawer(); }
function closeDrawer() { document.getElementById('drawer').classList.remove('show'); document.getElementById('drawer-overlay').classList.remove('show'); }

function downloadPdf() {
  const items = quote.map(line => {
    const unit = line.ml_ars * (1 - (line.discount||0)/100);
    return {
      codigo: line.codigo,
      descripcion: line.desc,
      marca: line.marca,
      cantidad: line.qty,
      descuento_pct: line.discount||0,
      precio_unitario: unit,
      subtotal: unit * line.qty,
    };
  });
  const totalGuardar = quote.reduce((s,l)=>s+lineTotal(l), 0);
  fetch('/api/quotes-create', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      client_name: window._qCliente || '',
      client_company: window._qEmpresa || '',
      total: totalGuardar,
      items,
    }),
  }).catch(err => console.error('No se pudo guardar el presupuesto:', err));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const cliente = window._qCliente || '';
  const empresa = window._qEmpresa || '';
  const fecha = new Date().toLocaleDateString('es-AR');

  doc.setFillColor(31,56,100);
  doc.rect(0,0,210,22,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(16); doc.setFont(undefined,'bold');
  doc.text('SEGTEC', 14, 14);
  doc.setFontSize(9); doc.setFont(undefined,'normal');
  doc.text('Presupuesto comercial', 14, 19);
  doc.setFontSize(9);
  doc.text('Fecha: '+fecha, 196, 14, {align:'right'});

  doc.setTextColor(26,26,46);
  let y = 32;
  doc.setFontSize(10); doc.setFont(undefined,'bold');
  doc.text('Cliente: ', 14, y); doc.setFont(undefined,'normal');
  doc.text(cliente || '—', 32, y);
  if (empresa) { doc.setFont(undefined,'bold'); doc.text('Empresa: ', 110, y); doc.setFont(undefined,'normal'); doc.text(empresa, 132, y); }
  y += 8;

  const rows = quote.map(line => {
    const unit = line.ml_ars * (1 - (line.discount||0)/100);
    const total = unit * line.qty;
    return [
      line.tipo==='servicio' ? ('Servicio\n'+line.zonaLabel) : (line.marca + '\n' + line.codigo),
      line.desc + (line.tipo==='servicio' ? ' ('+line.pagoLabel+')' : ''),
      String(line.qty),
      (line.discount||0) + '%',
      '$ ' + Math.round(unit).toLocaleString('es-AR'),
      '$ ' + Math.round(total).toLocaleString('es-AR')
    ];
  });

  doc.autoTable({
    startY: y,
    head: [['Marca / Código','Descripción','Cant.','Desc.','P. Unit.','Subtotal']],
    body: rows,
    styles: { fontSize: 8, cellPadding: 3 },
    headStyles: { fillColor: [31,56,100], textColor:255, fontStyle:'bold' },
    columnStyles: { 0:{cellWidth:28}, 2:{cellWidth:14,halign:'center'}, 3:{cellWidth:14,halign:'center'}, 4:{cellWidth:26,halign:'right'}, 5:{cellWidth:28,halign:'right'} },
  });

  let finalY = doc.lastAutoTable.finalY + 8;
  const granTotal = quote.reduce((s,l)=>s+lineTotal(l), 0);
  const ivaTotal = quote.reduce((s,l)=>{ const total=lineTotal(l); const rate=l.iva||0; return s + (rate>0?total-total/(1+rate):0); },0);
  const neto = granTotal - ivaTotal;

  doc.setFontSize(9);
  doc.text('Subtotal neto: $ ' + Math.round(neto).toLocaleString('es-AR'), 196, finalY, {align:'right'});
  doc.text('IVA: $ ' + Math.round(ivaTotal).toLocaleString('es-AR'), 196, finalY+6, {align:'right'});
  doc.setFontSize(12); doc.setFont(undefined,'bold');
  doc.text('TOTAL: $ ' + Math.round(granTotal).toLocaleString('es-AR'), 196, finalY+14, {align:'right'});

  doc.setFontSize(8); doc.setFont(undefined,'normal'); doc.setTextColor(120,120,120);
  doc.text('Presupuesto sujeto a confirmación de stock y validez de precios al momento del cierre. SEGTEC SA.', 14, finalY+26);

  doc.save('presupuesto_segtec_'+fecha.replace(/\//g,'-')+'.pdf');
}

function populateFilters(tab) {
  const keyMap = { corredizos:'CORREDIZOS', levadizos:'LEVADIZOS', pivotantes:'PIVOTANTES', accesorios:'ACCESORIOS', servicios:'SERVICIOS' };
  const prods = DATA[keyMap[tab]] || [];
  const marcas = [...new Set(prods.map(p=>p.marca).filter(Boolean))].sort();
  const segmentos = [...new Set(prods.map(p=>p.seg).filter(Boolean))];
  const mSel = document.getElementById('f-marca'); const sSel = document.getElementById('f-seg');
  mSel.innerHTML = '<option value="">Todas las marcas</option>';
  sSel.innerHTML = '<option value="">Todos los segmentos</option>';
  marcas.forEach(m => mSel.innerHTML += '<option value="'+m+'">'+m+'</option>');
  segmentos.forEach(s => { const [lbl] = segLabel(s); sSel.innerHTML += '<option value="'+s.substring(0,15)+'">'+lbl+'</option>'; });
}
function filterProds(prods) {
  return prods.map((p,idx)=>({p,idx})).filter(({p}) => {
    const m = filters.marca ? p.marca===filters.marca : true;
    const s = filters.seg ? (p.seg||'').includes(filters.seg) : true;
    const q = filters.search ? ((p.desc||'').toLowerCase().includes(filters.search) || (p.codigo||'').toLowerCase().includes(filters.search)) : true;
    return m && s && q;
  });
}
function applyFilters() {
  filters.marca = document.getElementById('f-marca').value;
  filters.seg = document.getElementById('f-seg').value;
  filters.search = document.getElementById('f-search').value.trim().toLowerCase();
  renderCurrentTab();
}
function resetFilters() {
  filters = { marca:'', seg:'', search:'' };
  document.getElementById('f-marca').value=''; document.getElementById('f-seg').value=''; document.getElementById('f-search').value='';
  renderCurrentTab();
}

// ── SERVICIOS ──
const ZONAS = [
  { key: 'capital', label: 'Capital - GBA Oeste' },
  { key: 'gba', label: 'GBA Sur - GBA Norte' },
];
const PAGOS = [
  { key: 'efectivo', label: 'Efectivo (sin IVA)', iva: 0 },
  { key: 'transferencia', label: 'Transferencia (con IVA)', iva: 0.21 },
  { key: 'cuotas3', label: '3 cuotas (con IVA)', iva: 0.21 },
  { key: 'cuotas6', label: '6 cuotas (con IVA)', iva: 0.21 },
];
const serviceSel = {}; // { idx: { zona, pago } }

function servicePrecio(p, zona, pago) {
  const campo = 'p_' + zona + '_' + pago;
  return p[campo] ?? null;
}
function maxDiscountService(p) {
  if (p.desc_max===null||p.desc_max===undefined||p.desc_max<0) return 0;
  return Math.round(p.desc_max*100);
}
function servicioSetSel(idx, field, value) {
  if (!serviceSel[idx]) serviceSel[idx] = { zona: 'capital', pago: 'efectivo' };
  serviceSel[idx][field] = value;
  const cell = document.getElementById('svc-precio-'+idx);
  if (cell) {
    const p = DATA.SERVICIOS[idx];
    const precio = servicePrecio(p, serviceSel[idx].zona, serviceSel[idx].pago);
    cell.textContent = precio ? fmtMoney(precio) : 'Consultar';
  }
}
function addServiceToQuote(idx, btn) {
  const p = DATA.SERVICIOS[idx];
  const sel = serviceSel[idx] || { zona: 'capital', pago: 'efectivo' };
  const precio = servicePrecio(p, sel.zona, sel.pago);
  if (!precio) return;
  const pagoInfo = PAGOS.find(x => x.key === sel.pago);
  const zonaInfo = ZONAS.find(x => x.key === sel.zona);
  quote.push({
    sheet: 'SERVICIOS', idx, tipo: 'servicio',
    codigo: p.codigo, desc: p.desc, marca: 'Servicio',
    zonaLabel: zonaInfo.label, pagoLabel: pagoInfo.label,
    ml_ars: precio, iva: pagoInfo.iva,
    maxDisc: maxDiscountService(p), qty: 1, discount: 0,
  });
  updateQuoteUI();
  if (btn) { btn.textContent='Agregado ✓'; btn.classList.add('added');
    setTimeout(()=>{ btn.textContent='+ Agregar'; btn.classList.remove('added'); }, 1200); }
}

        '<td class="col-desc"><div style="font-weight:600;color:var(--navy);font-size:11.5px">'+p.desc+'</div><div style="font-size:10px;color:var(--gray)">'+p.codigo+'</div></td>'+

      '</tr>';
    });
    html += '</tbody></table></div></div>';
  }
  container.innerHTML = html;

function switchTab(tab, btn) {
  currentTab = tab; filters = { marca:'', seg:'', search:'' };
  document.getElementById('f-marca').value=''; document.getElementById('f-seg').value=''; document.getElementById('f-search').value='';
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active'); btn.classList.add('active');
  populateFilters(tab); renderCurrentTab();
}
function renderCurrentTab() {
  const tab = currentTab;
  if (tab==='corredizos') renderMotores('CORREDIZOS', document.getElementById('render-corredizos'), 'Cremallera');
  else if (tab==='levadizos') renderMotores('LEVADIZOS', document.getElementById('render-levadizos'), 'Accionador');
  else if (tab==='pivotantes') renderMotores('PIVOTANTES', document.getElementById('render-pivotantes'), 'Ancho hoja');
  else if (tab==='accesorios') renderAccesorios(document.getElementById('render-accesorios'));
  else if (tab==='servicios') renderServicios(document.getElementById('render-servicios'));
}
function initApp() { populateFilters('corredizos'); renderCurrentTab(); updateQuoteUI(); }
</script>
